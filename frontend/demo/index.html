<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>OpenPath demo</title>
    <style>
      /* A plain host page. The only OpenPath-specific lines are the two theme variables. */
      body {
        margin: 0;
        padding: 1rem;
        background: #f6f6f2;
        color: #1b1b1b;
        font-family: Georgia, serif;
        line-height: 1.5;
      }
      main { max-width: 44rem; margin: 0 auto; }
      openpath-flow {
        --openpath-color: #0b5cad;
        --openpath-font: system-ui, sans-serif;
      }
      pre { white-space: pre-wrap; overflow-wrap: anywhere; background: #fff; padding: 1rem; border: 1px solid #5c5c5c; }
    </style>
  </head>
  <body>
    <main>
      <h1>Join ALX</h1>
      <p>This page uses no framework. It only adds one script and one tag.</p>

      <script src="/openpath.js"></script>
      <openpath-flow questions="/questions/onboarding.json" api="http://localhost:4000" lang="en" languages="en,am,ar"></openpath-flow>

      <h2>Events from the form</h2>
      <p>The host page can listen for <code>openpath:step</code> and <code>openpath:complete</code>.</p>
      <pre id="log" aria-label="Event log">No events yet.</pre>
    </main>
    <script>
      const log = document.getElementById('log');
      const lines = [];
      function show(name, detail) {
        lines.unshift(name + ' ' + JSON.stringify(detail));
        log.textContent = lines.slice(0, 8).join('\n');
      }
      document.addEventListener('openpath:step', (e) => show('openpath:step', e.detail));
      document.addEventListener('openpath:complete', (e) => show('openpath:complete', e.detail));
    </script>
  </body>
</html>
